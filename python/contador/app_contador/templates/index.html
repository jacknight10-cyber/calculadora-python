<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNEFA - Ingreso de Datos</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo {
            max-width: 130px;
            margin-bottom: 20px;
        }
        h2 {
            color: #003366; /* Azul institucional */
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #002244;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="{{ url_for('static', filename='unefa_logo.png') }}" alt="Logo UNEFA" class="logo">
        
        <h2>Control de Edades</h2>
        <p>Sistemas de Información - UNEFA</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/" method="POST">
            <div class="form-group">
                <label for="edades">Ingrese las edades (separadas por comas):</label>
                <input type="text" id="edades" name="edades" value="20, 23, 23, 21, 20, 21, 22, 19, 19, 20, 21, 23, 20, 21, 20, 23" required>
            </div>
            <button type="submit">Procesar con Python</button>
        </form>
    </div>

</body>
</html>
