<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNEFA - Resultados del Análisis</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #003366;
            margin-bottom: 20px;
        }
        .box {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: left;
        }
        .box strong {
            color: #003366;
        }
        .badge {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            padding: 3px 10px;
            border-radius: 4px;
            float: right;
        }
        .bg-max { background-color: #d9534f; }
        .bg-min { background-color: #5cb85c; }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Resultados del Análisis</h2>
        
        <div class="box">
            <strong>Lista analizada (sin duplicados):</strong>
            <p style="word-wrap: break-word; margin: 5px 0 0 0;">{{ lista_filtrada }}</p>
        </div>

        <div class="box">
            <strong>Edad MÁXIMA:</strong>
            <span class="badge bg-max">{{ max }}</span>
        </div>

        <div class="box">
            <strong>Edad MÍNIMA:</strong>
            <span class="badge bg-min">{{ min }}</span>
        </div>

        <a href="/" class="btn-back">Volver a calcular</a>
    </div>

</body>
</html>
